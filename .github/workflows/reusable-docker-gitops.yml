name: Reusable Docker & GitOps Pipeline

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
        description: "Target container image name (e.g. yunusekc/inventory-track)"
      dockerfile_path:
        required: false
        type: string
        default: "./Dockerfile"
        description: "Relative path to Dockerfile"
      build_context:
        required: false
        type: string
        default: "."
        description: "Docker build context directory"
      registry:
        required: false
        type: string
        default: "ghcr.io"
        description: "Target container registry URL"
      kustomize_dir:
        required: false
        type: string
        default: ""
        description: "Directory containing kustomization.yaml (if omitted, GitOps bump is skipped)"
      kustomize_image_name:
        required: false
        type: string
        default: ""
        description: "Image identifier name defined in kustomization.yaml to be updated"
      run_tests:
        required: false
        type: boolean
        default: true
        description: "Run unit tests before building container"
      dotnet_version:
        required: false
        type: string
        default: "10.0.x"
        description: ".NET SDK version to install if run_tests is true"
      test_path:
        required: false
        type: string
        default: ""
        description: "Target solution (.sln/.slnx) or test project (.csproj) path. Auto-detects if omitted."
      enable_security_scan:
        required: false
        type: boolean
        default: false
        description: "Run Trivy container vulnerability scan"
    secrets:
      ghcr_token:
        required: false
        description: "Custom registry auth token. Defaults to GITHUB_TOKEN if not passed."

jobs:
  test:
    name: 🧪 Quality Gate (Unit Tests)
    if: ${{ inputs.run_tests }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Kodu Çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: ⚙️ .NET SDK Kurulumu (${{ inputs.dotnet_version }})
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: 🧪 Birim Testleri Çalıştır
        run: |
          if [ -n "${{ inputs.test_path }}" ]; then
            echo "Belirtilen test hedefi çalıştırılıyor: ${{ inputs.test_path }}"
            dotnet test "${{ inputs.test_path }}" --configuration Release --verbosity normal
          else
            TARGET_FILE=$(find . -maxdepth 2 \( -name "*.slnx" -o -name "*.sln" \) | head -n 1)
            if [ -n "$TARGET_FILE" ]; then
              echo "Otomatik tespit edilen çözüm dosyası çalıştırılıyor: $TARGET_FILE"
              dotnet test "$TARGET_FILE" --configuration Release --verbosity normal
            else
              dotnet test --configuration Release --verbosity normal
            fi
          fi

  build-and-gitops:
    name: 📦 Build, Push & GitOps Sync
    needs: [test]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: 📥 Kodu Çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🛠️ Docker Buildx Kurulumu
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Registry Girişi (${{ inputs.registry }})
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.ghcr_token || secrets.GITHUB_TOKEN }}

      - name: 🏷️ Docker Metadata & Etiket Yönetimi
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.registry }}/${{ inputs.image_name }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: 🚀 Docker İmajını Derle ve GHCR'ye Yükle (GHA Cache Destekli)
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile_path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: 🛡️ Trivy Güvenlik Taraması (Opsiyonel)
        if: ${{ inputs.enable_security_scan }}
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ inputs.registry }}/${{ inputs.image_name }}:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: 🔄 GitOps Kustomize Manifest Güncelle ve Push Et
        if: ${{ inputs.kustomize_dir != '' && inputs.kustomize_image_name != '' }}
        run: |
          cd ${{ inputs.kustomize_dir }}
          
          echo "Kustomize ile imaj etiketi güncelleniyor: ${{ inputs.kustomize_image_name }}=${{ inputs.registry }}/${{ inputs.image_name }}:${{ github.sha }}"
          kustomize edit set image ${{ inputs.kustomize_image_name }}=${{ inputs.registry }}/${{ inputs.image_name }}:${{ github.sha }}
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kustomization.yaml
          
          if git diff --staged --quiet; then
            echo "Kustomization.yaml dosyasında değişiklik yok, commit atlanıyor."
          else
            echo "Değişiklik tespit edildi, commit ve push yapılıyor..."
            git commit -m "chore(gitops): update image tag to ${{ github.sha }} [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi

      - name: 📊 Pipeline Özeti (Job Summary)
        if: always()
        run: |
          echo "## 🚀 CI / GitOps Pipeline Özeti" >> $GITHUB_STEP_SUMMARY
          echo "| Parametre | Değer |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Hedef İmaj** | \`${{ inputs.registry }}/${{ inputs.image_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit SHA (Tag)** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Önbellek (Cache)** | \`type=gha,mode=min\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Test Durumu** | \`${{ needs.test.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Güvenlik Taraması** | \`${{ inputs.enable_security_scan && 'Aktif' || 'Devre Dışı' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **GitOps Senkronizasyonu** | \`${{ inputs.kustomize_dir != '' && 'Tamamlandı' || 'Atlandı' }}\` |" >> $GITHUB_STEP_SUMMARY
